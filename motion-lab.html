<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动作检查 · 十一码之夜</title><style>body{margin:0;background:#172625;color:#e3ede7;font:15px system-ui}header{position:absolute;z-index:2;top:20px;left:24px;right:24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}select,button,.prototype-link{padding:10px;background:#c6dfd0;border:0;border-radius:8px;color:#172625;text-decoration:none}input[type=range]{width:24vw}canvas{display:block}footer{position:absolute;bottom:20px;left:24px;right:24px;font-size:12px}footer .prototype-link{display:inline-block;padding:4px 8px}</style><header><b>动作检查</b><select aria-label="动作"><option value="kick">完整助跑与射门</option><option value="runup0">短步直线助跑</option><option value="runup1">斜向助跑</option><option value="runup2">碎步调整助跑</option><option value="dive">判断正确 · 舒展扑救</option><option value="hesitate">判断错误 · 倾斜半扑</option><option value="stretch">死角伸展扑救</option><option value="low">低球侧扑</option><option value="prepare">侧移预备与蹬地</option><option value="tracking">移动追球与封堵</option><option value="recover">落地收腿与起身</option><option value="hold">接稳抱球</option><option value="warmup">首页热身</option><option value="center">中路抬手</option><option value="center-low">中路下蹲接球</option><option value="gather">收球过渡回放</option></select><select aria-label="射门方向" id="shot-direction"><option value="0">中路射门</option><option value="-3.5">左路射门</option><option value="3.5">右路射门</option></select><select aria-label="扑救方向" id="keeper-direction"><option value="1">门将向右扑</option><option value="-1">门将向左扑</option></select><select aria-label="射门力度" id="shot-power"><option value="0.2">轻推</option><option value="0.7" selected>标准力度</option><option value="1">全力射门</option></select><select aria-label="射门方式" id="shot-type"><option value="normal">常规射门</option><option value="low">低平抽射</option><option value="chip">勺子挑射</option></select><label>时间 <input aria-label="时间" type="range" min="0" max="4" step="0.01" value="0"></label><output>0.00 秒</output><span id="motion-phase"></span><select aria-label="播放速度" id="playback-speed"><option value="1">正常速度</option><option value="0.5">半速</option><option value="0.25">四分之一速度</option></select><button>播放</button><label><input type="checkbox" id="face-view"> 面部近景</label></header><footer>左侧为正面，右侧为侧面 · 游戏同款模型与动作 · 门将沿用物理骨架 · <span id="asset-status">模型加载中</span> · <a class="prototype-link" href="./character-credits.txt">素材署名</a></footer><script type="module">
import * as THREE from 'three';import {GameCharacter,KICK_CONTACT} from './src/game-character.js';import {strikerRunupPose,penaltyStyles,goalkeeperPose,holdingPose,HOLD_DURATION,keeperHesitationPose,keeperWarmupPose,keeperPreparation,blendKeeperPose,limb,body} from './src/anatomy.js';

const scene=new THREE.Scene();scene.background=new THREE.Color('#172625');const r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(renderPixelRatio(innerWidth,innerHeight,devicePixelRatio));r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);r.toneMapping=THREE.ACESFilmicToneMapping;
scene.add(new THREE.HemisphereLight('#e6f1ee','#45624d',2));const light=new THREE.DirectionalLight('#ffffff',3);light.position.set(2,6,4);scene.add(light);const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:'#314d43'}));ground.rotation.x=-Math.PI/2;ground.position.y=-.014;scene.add(ground);const grid=new THREE.GridHelper(30,60,'#638477','#426354');scene.add(grid);

const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,60);camera.position.set(1.5,2.0,10.2);camera.lookAt(1.5,.9,0);
const shotType=document.querySelector('#shot-type');

const shotDirection=document.querySelector('#shot-direction'),faceView=document.querySelector('#face-view'),headCenter=new THREE.Vector3();

function frame(now){
  frameRequest=0;
  advance(now);slider.value=playhead;
  const t=playhead,direction=Number(keeperDirection.value),power=Number(shotPower.value);output.value=t.toFixed(2)+' 秒';let phaseText,p,kickContact=KICK_CONTACT,ballPosition={x:0,y:.11,z:0};
    if(select.value==='kick'||select.value.startsWith('runup')){const style=select.value==='kick'?{...penaltyStyles[0],duration:KICK_CONTACT}:penaltyStyles[Number(select.value.slice(-1))],contact=style.duration;kickContact=contact;phaseText=t<contact-.55?'助跑':t<contact-.21?'落支撑脚':t<contact?'摆腿触球':t<contact+.22?'顺势随摆':t<contact+.85?'落脚收势':'完成';ballPosition=shotBall(t-contact);p=strikerRunupPose(t,Math.min(1,t/contact),t>=contact?t-contact:-1,power,+shotDirection.value,style,shotType.value);}
