<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动作检查 · 十一码之夜</title><style>body{margin:0;background:#172625;color:#e3ede7;font:15px system-ui}header{position:absolute;z-index:2;top:20px;left:24px;right:24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}select,button{padding:10px;background:#c6dfd0;border:0;border-radius:8px}input[type=range]{width:24vw}canvas{display:block}footer{position:absolute;bottom:20px;left:24px}</style><header><b>动作检查</b><select aria-label="动作"><option value="kick">踢球</option><option value="runup0">短步直线助跑</option><option value="runup1">斜向助跑</option><option value="runup2">碎步调整助跑</option><option value="dive">高球侧扑</option><option value="hesitate">判断错边收住动作</option><option value="stretch">死角伸展扑救</option><option value="low">低球侧扑</option><option value="hold">接稳抱球</option><option value="warmup">首页热身</option><option value="center">中路抬手</option><option value="center-low">中路下蹲接球</option><option value="gather">收球过渡回放</option></select><select aria-label="射门方向" id="shot-direction"><option value="0">中路射门</option><option value="-3.5">左路射门</option><option value="3.5">右路射门</option></select><label>时间 <input aria-label="时间" type="range" min="0" max="4" step="0.01" value="0"></label><output>0.00 秒</output><select aria-label="播放速度" id="playback-speed"><option value="1">正常速度</option><option value="0.5">半速</option><option value="0.25">四分之一速度</option></select><button>播放</button><label><input type="checkbox" id="face-view"> 面部近景</label></header><footer>左侧为正面，右侧为侧面 · 米制固定骨架</footer><script type="module">
import * as THREE from 'three';import {Player} from './src/character.js';import {strikerRunupPose,penaltyStyles,strikerPose,goalkeeperPose,holdingPose,HOLD_DURATION,keeperHesitationPose,keeperWarmupPose} from './src/anatomy.js';
import {Shot} from './src/engine.js';
const catchStats={accuracy:90,power:90,touch:90,composure:90,speed:80,reach:80,handling:95},catchReplay=new Shot({x:Math.sin(59)*3.3,power:.9,y:1.3},catchStats,catchStats,1,59);
for(let n=0;n<3600&&!catchReplay.result;n++)catchReplay.step(1/120);
const scene=new THREE.Scene();scene.background=new THREE.Color('#172625');const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);r.shadowMap.enabled=true;r.toneMapping=THREE.ACESFilmicToneMapping;
scene.add(new THREE.HemisphereLight('#e6f1ee','#45624d',2));const light=new THREE.DirectionalLight('#ffffff',3);light.position.set(2,6,4);scene.add(light);const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:'#314d43'}));ground.rotation.x=-Math.PI/2;ground.position.y=-.014;scene.add(ground);const grid=new THREE.GridHelper(30,60,'#638477','#426354');scene.add(grid);
const pairs={kick:[new Player(scene,'#b9efd7'),new Player(scene,'#e8ac73')],keeper:[new Player(scene,'#b9efd7',true),new Player(scene,'#e8ac73',true)]};
const ballGeometry=new THREE.SphereGeometry(.11,20,14),ballMaterial=new THREE.MeshStandardMaterial({color:'#e6ede4',roughness:.6});
for(const pair of Object.values(pairs))pair.forEach((player,i)=>{player.group.position.x=i*3;const ball=new THREE.Mesh(ballGeometry,ballMaterial);player.group.add(ball);player.labBall=ball;});
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,60);camera.position.set(2.5,2.8,14);camera.lookAt(2.5,1,0);
const shotDirection=document.querySelector('#shot-direction'),faceView=document.querySelector('#face-view'),headCenter=new THREE.Vector3();
const slider=document.querySelector('input[type=range]'),select=document.querySelector('select'),output=document.querySelector('output'),button=document.querySelector('button');let playing=false,last=0,playhead=0;
slider.oninput=()=>{playhead=Number(slider.value);};
select.onchange=()=>{playhead=0;slider.value=0;};
document.addEventListener('visibilitychange',()=>{last=0;});
window.addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
button.onclick=()=>{if(playhead>=4)playhead=0;playing=!playing;last=0;button.textContent=playing?'暂停':'播放';};
function frame(now){const dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(playing){playhead=Math.min(4,playhead+dt*Number(document.querySelector('#playback-speed').value));slider.value=playhead;if(playhead===4){playing=false;button.textContent='播放';}}const t=playhead;output.value=t.toFixed(2)+' 秒';let p,ballPosition={x:0,y:.11,z:0};if(select.value==='kick'||select.value.startsWith('runup')){const style=penaltyStyles[Number(select.value.slice(-1))];p=style?strikerRunupPose(t,Math.min(1,t/style.duration),t>=style.duration?t-style.duration:-1,.7,+shotDirection.value,style):strikerPose(t,Math.min(1,t/.55),t>=.55?t-.55:-1,.7,+shotDirection.value);for(const key of ['hip','shoulder','head', 'shoulders','hips','hands','elbows','feet','knees']){if(Array.isArray(p[key]))p[key].forEach(v=>v.z-=11);else p[key].z-=11;}}else {p=goalkeeperPose({speed:85,reach:85,stretch:select.value==='stretch'?1:0},select.value.startsWith('center')?0:1,t,select.value==='center-low'?.3:select.value==='low'?.35:select.value==='center'?1.65:2);if(select.value==='warmup')p=keeperWarmupPose(t);if(select.value==='hesitate'){const origin=goalkeeperPose({speed:85,reach:85},1,.10,1.2);p=t<.10?goalkeeperPose({speed:85,reach:85},1,t,1.2):keeperHesitationPose(origin,1,t-.10);}if(select.value==='hold'){const hold=holdingPose(p);p=hold.pose;ballPosition=hold.center;}if(select.value==='gather'){const raw=catchReplay.poseAt(catchReplay.t+t),hold=holdingPose(raw,t/HOLD_DURATION);p=hold.pose;const q=Math.min(1,t/HOLD_DURATION),w=q*q*(3-2*q);ballPosition={};for(const key of ['x','y','z']){const start=catchReplay.ball[key]+p.shoulder[key]-catchReplay.pose.shoulder[key];ballPosition[key]=start+(hold.center[key]-start)*w;}}const shift=p.hip.x;if(['hold','gather'].includes(select.value))ballPosition.x-=shift;for(const key of ['hip','shoulder','head','shoulders','hips','hands','elbows','feet','knees']){if(Array.isArray(p[key]))p[key].forEach(v=>v.x-=shift);else p[key].x-=shift;}}const type=select.value==='kick'||select.value.startsWith('runup')?'kick':'keeper';for(const [key,pair] of Object.entries(pairs))pair.forEach((player,i)=>{player.group.visible=key===type;if(key!==type)return;player.pose(p);player.labBall.visible=(type==='kick'||['hold','gather'].includes(select.value));player.labBall.position.set(ballPosition.x,ballPosition.y,ballPosition.z);player.group.rotation.y=(type==='kick'?Math.PI:0)-(i?Math.PI/2:0);});if(faceView.checked){const player=pairs[type][0];player.group.updateWorldMatrix(true,true);player.head.getWorldPosition(headCenter);camera.fov=22;camera.position.set(headCenter.x+.12,headCenter.y+.02,headCenter.z+1);camera.lookAt(headCenter);}else{camera.fov=35;camera.position.set(2.5,2.8,14);camera.lookAt(2.5,1,0);}camera.updateProjectionMatrix();r.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
