<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>人物原型对比 · 十一码之夜</title>
  <style>
    :root { color-scheme: dark; font: 14px system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #172625; color: #e3ede7; }
    canvas { position: fixed; inset: 0; z-index: 0; display: block; width: 100vw; height: 100dvh; touch-action: none; }
    header { position: fixed; z-index: 2; top: max(12px, env(safe-area-inset-top)); left: 18px; right: 18px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    header b { margin-right: 8px; font-size: 15px; }
    select, button, a { min-height: 38px; padding: 8px 10px; border: 0; border-radius: 8px; background: #c6dfd0; color: #172625; font: inherit; }
    button, a { cursor: pointer; text-decoration: none; }
    input[type=range] { width: min(27vw, 330px); vertical-align: middle; accent-color: #9fd5b4; }
    #time-readout { min-width: 52px; display: inline-block; }
    #phase { color: #cce7d6; }
    footer { position: fixed; z-index: 2; bottom: max(12px, env(safe-area-inset-bottom)); left: 18px; right: 18px; color: #cfddd4; text-shadow: 0 1px 3px #172625; pointer-events: none; }
    #labels { position: fixed; z-index: 1; top: 128px; left: 0; right: 0; display: flex; justify-content: space-around; pointer-events: none; }
    #labels span { min-width: 126px; padding: 7px 11px; border-radius: 999px; background: #172625c9; color: #e7f2eb; text-align: center; }
    #metrics { position: fixed; z-index: 2; right: 16px; bottom: 42px; width: min(390px, 45vw); padding: 11px 13px; border: 1px solid #a9c4b533; border-radius: 10px; background: #13201edb; color: #d8e6dc; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-line; }
    #metrics[data-error="true"] { color: #ffd1c9; }
    #metrics-toggle { position: fixed; z-index: 3; right: 16px; bottom: 8px; }
    #labels[hidden] { display: none; }
    #metrics[hidden] { display: none; }
    @media (max-height: 500px) {
      header { max-height: 25dvh; overflow: auto; }
      #play { order: -1; }
      #labels { top: auto; bottom: 48px; }
      footer { max-width: 70%; font-size: 10px; }
    }
    @media (max-width: 700px) {
      header { top: max(6px, env(safe-area-inset-top)); left: 7px; right: 7px; gap: 5px; max-height: 30dvh; overflow: auto; padding: 5px; border-radius: 10px; background: #172625d9; }
      header b { width: 100%; margin: 0 0 2px; }
      select, button, a { min-height: 40px; padding: 6px 7px; font-size: 12px; }
      input[type=range] { width: 32vw; }
      #labels { top: 28dvh; }
      #labels span { min-width: 0; padding: 5px 8px; font-size: 11px; }
      #metrics { right: 7px; bottom: max(39px, env(safe-area-inset-bottom)); width: min(245px, 64vw); padding: 8px 9px; font-size: 10px; line-height: 1.35; }
      footer { left: 8px; bottom: max(8px, env(safe-area-inset-bottom)); font-size: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <b>单角色原型 · 同机位动作对比</b>
    <a href="./keeper-motion-lab.html">门将动捕原型</a><a href="./motion-lab.html">完整动作检查页</a>
    <label>原型 <select id="asset-version" aria-label="原型版本"><option value="mocap">真人足球动捕</option><option value="quaternius">身体动作修正版</option><option value="refined">自制修正版</option><option value="baseline">修改前 GLB</option></select></label>
    <label>机位 <select id="camera-view" aria-label="观察机位"><option value="front">正面</option><option value="oblique">斜侧面</option><option value="side">侧面细看</option></select></label>
    <label>方向 <select id="direction" aria-label="射门方向"><option value="0">中路</option><option value="-3.5">左侧</option><option value="3.5">右侧</option></select></label>
    <label>力度 <select id="power" aria-label="射门力度"><option value="0.2">轻推</option><option value="0.7" selected>标准</option><option value="1">全力</option></select></label>
    <label>球路 <select id="shot-type" aria-label="射门方式"><option value="normal">常规</option><option value="low">低平球</option><option value="chip">勺子球</option></select></label>
    <label>时间 <input id="time" aria-label="时间" type="range" min="0" max="3.55" step="0.01" value="0"></label>
    <output id="time-readout">0.00 秒</output>
    <span id="phase">待机</span>
    <label>速度 <select id="speed" aria-label="播放速度"><option value="1">正常</option><option value="0.5">半速</option><option value="0.25">四分之一</option></select></label>
    <button id="play" type="button">播放</button>
  </header>
  <div id="labels" aria-hidden="true"><span>现有程序角色</span><span>骨骼蒙皮原型 · 11号</span></div>
  <aside id="metrics" aria-live="polite">正在加载骨骼原型…</aside>
  <button id="metrics-toggle" type="button" aria-controls="metrics" aria-expanded="true">性能数据</button>
  <footer>同镜头、时钟与球物理；原型当前共用基础射门片段，球路选项用于同步预演。</footer>
  <script type="module" src="./src/motion-lab-prototype.js"></script>
</body>
</html>
