<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>门将动作原型</title>
<style>*{box-sizing:border-box}body{margin:0;background:#172625;color:#e3ede7;font:14px system-ui;display:grid;grid-template-rows:auto minmax(220px,1fr) auto;height:100dvh}header,footer{padding:12px 18px;background:#172625}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,button,a{color:#172625;background:#c6dfd0;padding:9px;border:0;border-radius:7px;text-decoration:none}label{display:flex;align-items:center;gap:6px}input{max-width:32vw}#stage{min-height:0;overflow:hidden}canvas{display:block}footer{font-size:12px;line-height:1.6}footer a{padding:0;background:none;color:#b9efd7}#metrics{font-variant-numeric:tabular-nums}@media(max-height:500px){header,footer{padding:6px 12px}header{gap:5px}select,button,a{padding:6px}body{grid-template-rows:auto minmax(120px,1fr) auto}}</style>
<header><b>门将动作原型</b><a href="./motion-lab-prototype.html?asset=mocap">已验收射门</a>
<select id="motion" aria-label="门将动作"><optgroup label="完整动作链 · 混合原型"><option value="chain:Keeper_N05D">左扑 → 落地 → 起身</option><option value="chain:Keeper_O05E">右扑 → 落地 → 起身</option></optgroup><optgroup label="实拍重建 · 短扑救"><option value="Keeper_N05D">扑救 N05D</option><option value="Keeper_O05E">扑救 O05E</option></optgroup><optgroup label="现有程序动作 · 骨骼映射检查"><option value="warmup">热身</option><option value="prepare">预备与蹬地</option><option value="recover">落地起身</option><option value="catch">实际接球 → 缓冲 → 抱球</option><option value="hold">接稳抱球</option><option value="hesitate">判断错误与恢复</option></optgroup></select>
<select id="direction" aria-label="程序动作方向"><option value="1">向右</option><option value="-1">向左</option></select>
<select id="view" aria-label="视角"><option value="front">正面</option><option value="side">侧面</option><option value="oblique">斜侧</option></select>
<button id="play" disabled>播放</button><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value="0.5">半速</option><option value="0.25">四分之一速度</option></select>
<label>时间 <input id="time" aria-label="时间" type="range" min="0" max="1.067" step="0.001" value="0"></label><output id="time-label">0.00 秒</output></header>
<main id="stage"></main><footer><div id="status">正在加载…</div><div id="metrics"></div><div>动作：<a href="https://doi.org/10.6084/m9.figshare.23507793">Rafael Monteiro / Figshare · CC BY 4.0</a>，实拍无标记重建、滤波与重定向；模型：Quaternius · CC0。原始数据为短扑救；完整动作链由程序补足，接球单独回放现有物理。</div></footer>
<script type="module" src="/src/keeper-motion-lab.js"></script></html>
